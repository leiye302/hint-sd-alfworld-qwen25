name: Clean-checkout CPU contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.3.5 requests==2.32.5
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==5.17.0 peft==0.21.0 accelerate==1.15.0 python-dotenv==1.2.2
      - run: python -m hint_alfworld.setup --framework
      - run: python -m hint_alfworld.setup --verify
      - run: python -m pytest tests -q
      - run: bash -n scripts/setup.sh scripts/train.sh scripts/run_both.sh scripts/eval.sh
      - run: bash scripts/run_both.sh --dry-run
